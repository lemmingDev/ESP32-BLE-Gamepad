---
name: Report size deltas

'on':
  workflow_run:
    workflows: ["Compile Sketches"]
    types: [ completed ]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      # github.event.workflow_run.pull_requests[] is only populated for pull requests
      # from the same repository, not from forks (a documented GitHub Actions
      # limitation - see https://github.com/orgs/community/discussions/25220). Almost
      # every real PR to this repo comes from a fork, so that field can't be used to
      # detect which build to report on. Look the PR up by head SHA instead, which
      # works regardless of where the PR came from.
      - name: Find associated pull request
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')

          if [ -z "$pr_number" ]; then
            echo "No open pull request found for commit ${{ github.event.workflow_run.head_sha }} (likely a push/schedule build) - nothing to report."
          else
            echo "Found open PR #$pr_number for commit ${{ github.event.workflow_run.head_sha }}"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.find-pr.outputs.pr_number != ''
        uses: actions/checkout@v6
        with:
          # If you rely on full history or special refs, include fetch-depth: 0
          fetch-depth: 0

      - name: Download report size data - action
        if: steps.find-pr.outputs.pr_number != ''
        uses: actions/download-artifact@v8
        with:
          name: report-size-data
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: report-size-data

      - name: Post report size deltas
        if: steps.find-pr.outputs.pr_number != ''
        uses: arduino/report-size-deltas@v1
        with:
          sketches-reports-source: report-size-data
