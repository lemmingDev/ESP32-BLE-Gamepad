name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. The more of this you fill in, the faster it can be diagnosed.

        Please check the [Troubleshooting Guide](https://github.com/lemmingDev/ESP32-BLE-Gamepad/blob/master/TroubleshootingGuide.md) and search [existing issues](https://github.com/lemmingDev/ESP32-BLE-Gamepad/issues) first — your problem may already have an answer.

  - type: textarea
    id: description
    attributes:
      label: What's the bug?
      description: A clear description of what's going wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1. Flash the attached sketch to a ...
        2. Pair with ...
        3. Press button 1 / move axis X / ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: mcu
    attributes:
      label: MCU
      options:
        - ESP32
        - ESP32-S3
        - ESP32-C3
        - ESP32-C6
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: board
    attributes:
      label: Development board
      description: The specific board/module, if relevant (e.g. "ESP32-DevKitC", "Lolin C3 Mini", "Adafruit QT Py ESP32-S3").
      placeholder: e.g. ESP32-DevKitC

  - type: input
    id: lib-version
    attributes:
      label: ESP32-BLE-Gamepad version
      description: Release version, or commit hash if built from source.
      placeholder: e.g. 0.7.4
    validations:
      required: true

  - type: input
    id: nimble-version
    attributes:
      label: NimBLE-Arduino version
      placeholder: e.g. 2.2.1
    validations:
      required: true

  - type: dropdown
    id: build-system
    attributes:
      label: Build system
      options:
        - Arduino IDE
        - arduino-cli
        - PlatformIO
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: core-version
    attributes:
      label: esp32 (Espressif) Arduino core version
      placeholder: e.g. 3.1.0

  - type: dropdown
    id: host-os
    attributes:
      label: Host OS you paired with
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: code-sample
    attributes:
      label: Minimal code sample
      description: The smallest sketch that reproduces the issue. This gets copy-pasted, so no need to also attach a file.
      render: C++

  - type: textarea
    id: logs
    attributes:
      label: Serial monitor output / logs
      description: Any relevant serial output, stack traces, or `nRF Connect`/BLE sniffer logs. This will be automatically formatted as a code block.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant — screenshots, other libraries in use, whether this worked in a previous version, etc.
