[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
lib_deps =
  h2zero/NimBLE-Arduino
  ../../
build_flags =
  -D BLE_GAMEPAD_DEBUG=1

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
lib_ldf_mode = deep+
lib_deps =
  h2zero/NimBLE-Arduino
  ../../
build_flags =
  -D BLE_GAMEPAD_DEBUG=1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode = deep+
lib_deps =
  h2zero/NimBLE-Arduino
  ../../
build_flags =
  -D BLE_GAMEPAD_DEBUG=1

